<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#18934D"/>
  <title>Page not found — Khusheel Tech</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;
      align-items:center;justify-content:center;text-align:center;padding:24px;
      background:linear-gradient(145deg,#18934D 0%,#0d6e39 100%);color:#fff}
    .box{max-width:420px}
    .mark{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.15);
      border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;
      justify-content:center;font-size:36px;font-weight:900;margin:0 auto 22px}
    .code{font-size:64px;font-weight:900;letter-spacing:-1px;line-height:1}
    h1{font-size:22px;font-weight:700;margin:10px 0 8px}
    p{font-size:15px;font-weight:500;color:rgba(255,255,255,.8);line-height:1.6}
    a{display:inline-block;margin-top:24px;background:#fff;color:#0d6e39;
      font-weight:700;font-size:14px;text-decoration:none;padding:12px 26px;border-radius:99px}
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">KT</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Back to Khusheel Tech</a>
  </div>
