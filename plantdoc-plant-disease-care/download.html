  <style>
    :root{
      --g:#18934D;--gd:#0d6e39;--gl:#e6f5ec;--white:#ffffff;
      --text:#111827;--muted:#6b7280;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased}
    body{
      font-family:'Montserrat',sans-serif;
      background:#f3faf6;
      min-height:100vh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:40px 20px;
    }

    /* ── exact card from index.html ── */
    .dl-wrap{
      max-width:760px;width:100%;margin:0 auto;
      background:linear-gradient(140deg,var(--g) 0%,var(--gd) 100%);
      border-radius:28px;padding:64px 48px;
      text-align:center;position:relative;overflow:hidden;
      box-shadow:0 32px 96px rgba(24,147,77,.32);
    }
    .dl-wrap::before{
      content:'';position:absolute;
      width:320px;height:320px;border-radius:50%;
      background:rgba(255,255,255,.06);top:-100px;right:-80px;
    }
    .dl-wrap::after{
      content:'';position:absolute;
      width:200px;height:200px;border-radius:50%;
      background:rgba(255,255,255,.04);bottom:-60px;left:-50px;
    }
    .dl-logo{
      width:88px;height:88px;border-radius:22px;
      object-fit:cover;margin:0 auto 24px;
      box-shadow:0 10px 32px rgba(0,0,0,.22);
      display:block;position:relative;z-index:1;
    }
    .dl-wrap h1{
      font-size:clamp(26px,4vw,40px);font-weight:900;
      color:#fff;margin-bottom:10px;letter-spacing:-.8px;
      position:relative;z-index:1;
    }
    .dl-sub{
      font-size:16px;color:rgba(255,255,255,.78);
      font-weight:500;margin-bottom:36px;line-height:1.6;
      position:relative;z-index:1;
    }
    .dl-btns{
      display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
      position:relative;z-index:1;
    }
    .dl-btn{
      display:inline-flex;align-items:center;gap:11px;
      background:#000;color:#fff;
      padding:0 20px;border-radius:13px;
      min-width:194px;height:64px;
      font-family:'Montserrat',sans-serif;cursor:pointer;
      border:1px solid rgba(255,255,255,.22);
      box-shadow:0 8px 24px rgba(0,0,0,.28);
      transition:transform .2s,box-shadow .2s,opacity .2s;
      text-decoration:none;
    }
    .dl-btn:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(0,0,0,.36)}
    .dl-btn svg{width:28px;height:28px;flex-shrink:0}
    .dl-btn-text{text-align:left;line-height:1.12}
    .dl-btn-sub{font-size:11px;font-weight:500;color:#fff;letter-spacing:.3px;opacity:.95}
    .dl-btn-name{font-size:19px;font-weight:700;color:#fff;letter-spacing:.2px;margin-top:1px}
    .dl-btn.soon{opacity:.6}

    .back{
      margin-top:24px;font-size:.82rem;color:rgba(0,0,0,.45);
      position:relative;z-index:1;
    }
    .back a{color:var(--g);font-weight:600;text-decoration:none;}
    .back a:hover{text-decoration:underline;}

    @media(max-width:520px){
      .dl-wrap{padding:48px 28px}
      .dl-btns{flex-direction:column;align-items:center}
    }
  </style>
</head>

  <div id="toast" style="display:none;position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#18934D;color:#fff;padding:12px 24px;border-radius:24px;font-family:inherit;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:9999;white-space:nowrap;"></div>

  <script>
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      t.style.opacity = '1';
      clearTimeout(t._tid);
      t._tid = setTimeout(function(){ t.style.display = 'none'; }, 3000);
    }
  </script>
