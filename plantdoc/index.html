  <!-- Permanent move: /plantdoc/ → /sprigly/ (Sprigly rebrand, 2026-09-02).
       GitHub Pages cannot issue a 301, so this page combines:
         1. rel=canonical  → tells search engines the new address
         2. meta refresh   → redirects browsers that ignore JS
         3. location.replace → instant redirect, no history entry
       Kept indefinitely: this old path may still be referenced by the
       privacy-policy URL filed with Google Play and App Store Connect, by
       Android App Links in shipped app versions, and by any inbound links
       already indexed. -->
  <link rel="canonical" href="https://khusheel-tech.github.io/sprigly/"/>
  <meta http-equiv="refresh" content="0; url=https://khusheel-tech.github.io/sprigly/"/>
  <meta name="robots" content="noindex, follow"/>

  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;

         text-align:center;padding:24px}
    a{color:#c6ff6e}
    .box{max-width:32rem}
    h1{font-size:1.25rem;margin:0 0 .5rem}
    p{opacity:.85;line-height:1.6;margin:.5rem 0}
  </style>
</head>
